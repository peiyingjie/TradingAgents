name: Go CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/tradingagents --help
      - run: go run ./cmd/tradingagents backtest --help
      - name: Install and smoke-test the default command
        run: |
          go install ./cmd/tradingagents
          "$(go env GOPATH)/bin/tradingagents" --help
          "$(go env GOPATH)/bin/tradingagents" backtest --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Go container and verify Compose profiles
        run: |
          cp .env.example .env
          docker compose --profile ollama config --quiet
          docker build -t tradingagents:smoke .
      - name: Verify container entrypoint and persistent data permissions
        run: |
          docker run --rm tradingagents:smoke --help
          docker run --rm tradingagents:smoke backtest --help
          docker run --rm --entrypoint sh -v tradingagents-smoke:/home/appuser/.tradingagents tradingagents:smoke -ec '
            test "$(id -u)" -ne 0
            test -z "$(command -v python || true)"
            test -z "$(command -v python3 || true)"
            test -r /etc/ssl/certs/ca-certificates.crt
            test -r /usr/share/zoneinfo/America/Chicago
            touch "$HOME/.tradingagents/write-check"
          '
