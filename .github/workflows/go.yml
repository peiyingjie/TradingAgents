name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/tradingagents --help
      - run: go run ./cmd/tradingagents backtest --help
